name: Publish package

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Update npm for trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm install

      - name: Prepare package metadata
        id: meta
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const isPreview = Boolean(process.env.PR_NUMBER);

          if (isPreview) {
            const baseVersion = String(pkg.version).split("-")[0];
            const shortSha = process.env.GITHUB_SHA.slice(0, 12).replace(/[^0-9A-Za-z-]/g, "");
            pkg.version = `${baseVersion}-pr.${process.env.PR_NUMBER}.${shortSha}.${process.env.GITHUB_RUN_NUMBER}.${process.env.GITHUB_RUN_ATTEMPT}`;
            fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          }

          const tag = isPreview ? `pr-${process.env.PR_NUMBER}` : "latest";
          const packageUrl = `https://www.npmjs.com/package/${pkg.name}/v/${pkg.version}`;
          console.log(`package_name=${pkg.name}`);
          console.log(`version=${pkg.version}`);
          console.log(`tag=${tag}`);
          console.log(`package_ref=${pkg.name}@${pkg.version}`);
          console.log(`tag_ref=${pkg.name}@${tag}`);
          console.log(`package_url=${packageUrl}`);
          NODE

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public --tag "${{ steps.meta.outputs.tag }}"

      - name: Verify published package
        run: |
          for attempt in {1..12}; do
            if npm view "${{ steps.meta.outputs.package_ref }}" version; then
              exit 0
            fi
            echo "Package is not visible in npm yet; retrying ($attempt/12)."
            sleep 5
          done
          npm view "${{ steps.meta.outputs.package_ref }}" version

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes

      - name: Comment package preview
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
          PACKAGE_REF: ${{ steps.meta.outputs.package_ref }}
          TAG_REF: ${{ steps.meta.outputs.tag_ref }}
          TAG: ${{ steps.meta.outputs.tag }}
          PACKAGE_URL: ${{ steps.meta.outputs.package_url }}
        with:
          script: |
            const marker = `<!-- mcpstack-preview-package:${process.env.PACKAGE_NAME} -->`;
            const manifestSnippet = JSON.stringify({ [process.env.PACKAGE_NAME]: process.env.TAG_REF }, null, 2);
            const body = [
              marker,
              "Preview packages published.",
              "",
              `- Package: [${process.env.PACKAGE_REF}](${process.env.PACKAGE_URL})`,
              `- Dist tag: \`${process.env.TAG}\``,
              `- Install: \`npm i ${process.env.TAG_REF}\``,
              "",
              "To use this in a platform PR preview, paste this into `infra/preview-packages.json`:",
              "",
              "```json",
              manifestSnippet,
              "```",
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  remove-preview-tag:
    name: Remove PR preview dist-tag
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Remove dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          TAG="pr-${PR_NUMBER}"
          npm dist-tag rm "$PACKAGE_NAME" "$TAG" || true
